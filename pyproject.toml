[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmc-sensor-audit"
# Read from `src/bmc_sensor_audit/__init__.py` rather than written here. The two
# were separate literals that happened to agree, which is the arrangement that
# drifts: nothing read the package one, so a bump here would have shipped a
# wheel whose `__version__` disagreed with its own metadata and no check would
# have noticed. One home, and the build backend reads it.
dynamic = ["version"]
description = "Find the sensors that should be reporting and are not."
readme = "README.md"
requires-python = ">=3.10"

# PEP 639 SPDX expression. Deliberately NO `License :: OSI Approved ::`
# classifier: the index rejects the two together, and hatchling accepts both
# happily, so a clean local build is not the check.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "James Sheen" }]
keywords = ["openbmc", "redfish", "bmc", "sensors", "monitoring", "hardware"]

# Stage 1 has NO dependencies, on purpose. The Redfish walk is built on urllib
# from the standard library so the coverage diff runs on a bring-up bench, a CI
# runner or a jump host with nothing provisioned first. `arbiter-engine` arrives
# at Stage 2 and not before -- as an optional extra, so Stage 1 keeps that
# property even after Stage 2 exists.
dependencies = []

[project.optional-dependencies]
detect = ["arbiter-engine>=0.1.6,<0.2"]
dev = ["pytest>=7"]

[project.scripts]
bmc-sensor-audit = "bmc_sensor_audit.cli:main"

# An index page with no way back to the source is a dead end for the one reader
# who wants to check a claim. CITATION.cff has carried the repository URL since
# it was written; this is the same fact, in the place a package manager reads.
[project.urls]
Homepage = "https://github.com/james-sheen/bmc-sensor-audit"
Source = "https://github.com/james-sheen/bmc-sensor-audit"
Issues = "https://github.com/james-sheen/bmc-sensor-audit/issues"

[tool.hatch.version]
path = "src/bmc_sensor_audit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bmc_sensor_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
